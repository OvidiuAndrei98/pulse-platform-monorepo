packages:
  - "apps/*"
  - "packages/*"
# Keep compatible transitive security fixes even when a parent pins an older
# patch/minor. Do not force Zod 3 consumers onto the incompatible Zod 4 API.
overrides:
  'undici@>=7.0.0 <7.30.1': '^7.30.1'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'
# The resolver imports Zod without declaring it as a peer. Bind that import to
# the app's Zod instead of whichever version another workspace package hoists.
packageExtensions:
  '@hookform/resolvers@5.9.2':
    peerDependencies:
      zod: '^3.25.0 || ^4.0.0'
  # Reanimated's ref declarations must use the app's React types. The web and
  # native apps use different React versions, so a hoisted @types/react is unsafe.
  'react-native-reanimated@4.7.1':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'react-native-screens@4.30.1':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  # The Worklets Babel plugin imports these without declaring dependencies.
  # Explicit links keep clean, isolated pnpm installs buildable on every host.
  'react-native-worklets@0.10.1':
    dependencies:
      '@babel/generator': '^7.29.0'
      '@babel/traverse': '^7.29.0'
allowBuilds:
  '@stripe/cli': false
  core-js: true
  esbuild: true
  sharp: true
# Reanimated 4.7 infers native worklet dependencies. Keep Bottom Sheet's
# explicit dependency arrays only for its web implementation.
patchedDependencies:
  '@gorhom/bottom-sheet@5.2.14': patches/@gorhom__bottom-sheet@5.2.14.patch
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.19'
  - '@expo/config-plugins@58.0.12'
  - '@expo/config@58.0.11'
  - '@expo/env@2.5.4'
  - '@expo/fingerprint@0.21.9'
  - '@expo/inline-modules@0.2.9'
  - '@expo/local-build-cache-provider@58.0.11'
  - '@expo/log-box@58.0.15'
  - '@expo/metro-config@58.0.21'
  - '@expo/prebuild-config@58.0.19'
  - '@expo/router-server@58.0.21'
  - babel-preset-expo@58.0.24
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo@58.0.23
  - '@expo/ui@58.0.27'
  - expo-notifications@58.1.8
  - expo-sharing@58.0.22
  - expo-splash-screen@58.0.13
  - react-native-safe-area-context@5.11.1

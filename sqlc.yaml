version: "2"
sql:
  - engine: "postgresql"
    schema: "api/internal/database/migrations"
    queries: "api/db/queries"
    gen:
      go:
        package: "db"
        out: "api/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: true

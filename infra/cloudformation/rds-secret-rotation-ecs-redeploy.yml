AWSTemplateFormatVersion: "2010-09-09"
Description: Restart Pulse API ECS tasks when RDS rotates the managed master password.

Parameters:
  DatabaseInstanceIdentifier:
    Type: String
    Default: pulse-db
  EcsClusterName:
    Type: String
    Default: pulse-cluster
  EcsServiceName:
    Type: String
    Default: pulse-api-service

Resources:
  RotationRedeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: pulse-rds-rotation-ecs-redeploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: force-pulse-api-redeployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                Resource: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${EcsClusterName}/${EcsServiceName}
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*

  RotationRedeployFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: pulse-rds-rotation-ecs-redeploy
      Description: Forces a new Pulse API ECS deployment after RDS master credential rotation.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt RotationRedeployRole.Arn
      Timeout: 30
      Environment:
        Variables:
          ECS_CLUSTER: !Ref EcsClusterName
          ECS_SERVICE: !Ref EcsServiceName
      Code:
        ZipFile: |
          import json
          import logging
          import os

          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          ecs = boto3.client("ecs")

          def handler(event, context):
              logger.info("RDS credential rotation event: %s", json.dumps(event))
              response = ecs.update_service(
                  cluster=os.environ["ECS_CLUSTER"],
                  service=os.environ["ECS_SERVICE"],
                  forceNewDeployment=True,
              )
              return {
                  "serviceArn": response["service"]["serviceArn"],
                  "deploymentId": response["service"]["deployments"][0]["id"],
              }

  RotationRedeployRule:
    Type: AWS::Events::Rule
    Properties:
      Name: pulse-rds-master-password-rotation
      Description: Redeploys Pulse API only when RDS resets pulse-db master credentials.
      EventPattern:
        source:
          - aws.rds
        detail-type:
          - RDS DB Instance Event
        detail:
          SourceIdentifier:
            - !Ref DatabaseInstanceIdentifier
          Message:
            - prefix: "Reset master credentials"
      State: ENABLED
      Targets:
        - Arn: !GetAtt RotationRedeployFunction.Arn
          Id: force-pulse-api-redeployment

  AllowEventBridgeInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RotationRedeployFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RotationRedeployRule.Arn

Outputs:
  FunctionName:
    Value: !Ref RotationRedeployFunction
  RuleName:
    Value: !Ref RotationRedeployRule
